<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Destilería Osmancito</title>
  <meta name="description" content="La Destilería Osmancito: entra al taller de cuadernos vivos o a la bodega de destilados terminados.">
  <link rel="icon" href="destilados/img/icon_amanita.ico">
  <style>
    :root { color-scheme: dark; --fondo:#0c0a08; --oro:#b99a62; --texto:#e9dfcd; --muted:#ad9d86; --borde:#5b482d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% 0%,#20180f 0%,var(--fondo) 62%); color:var(--texto); font: 1rem/1.65 Georgia, 'Times New Roman', serif; }
    main { width:min(850px,calc(100% - 2.5rem)); margin:0 auto; padding:clamp(4rem,12vh,8rem) 0 5rem; }
    .sello { color:var(--oro); font: .72rem/1.5 system-ui,sans-serif; letter-spacing:.28em; text-transform:uppercase; }
    h1 { font-weight:normal; font-size:clamp(2.65rem,8vw,5.5rem); line-height:1.08; letter-spacing:.035em; margin:2.2rem 0 1rem; }
    h1 span { color:var(--oro); font-style:italic; }
    .lema { color:var(--oro); font-size:clamp(1.1rem,2.5vw,1.45rem); font-style:italic; margin:0 0 4rem; }
    .puertas { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.2rem; }
    .puerta { display:block; border:1px solid var(--borde); padding:2rem; min-height:210px; color:inherit; text-decoration:none; background:rgba(19,15,11,.7); transition:background .2s,border-color .2s,transform .2s; }
    .puerta:hover,.puerta:focus-visible { background:#2a2014; border-color:var(--oro); transform:translateY(-3px); outline:none; }
    .puerta small { display:block; font: .7rem/1.5 system-ui,sans-serif; letter-spacing:.2em; color:var(--oro); text-transform:uppercase; }
    .puerta strong { display:block; margin:.6rem 0; font-size:2rem; font-weight:normal; }
    .puerta p { color:var(--muted); margin:0; }
    footer { margin-top:4rem; border-top:1px solid var(--borde); padding-top:1.2rem; color:var(--muted); font-size:.85rem; }
    @media (max-width:600px) { .puertas { grid-template-columns:1fr; } .puerta { min-height:0; } }
  </style>
</head>
<body>
<main>
  <div class="sello">La casa de la Destilería</div>
  <h1>Destilería <span>Osmancito</span></h1>
  <p class="lema">Entra la materia prima. Sale el destilado puro.</p>
  <nav class="puertas" aria-label="Elige una puerta">
    <a class="puerta" href="bodega.html"><small>Obra terminada</small><strong>La Bodega</strong><p>Los destilados reposan y añejan aquí.</p></a>
    <a class="puerta" href="taller.html"><small>Obra en marcha</small><strong>El Taller</strong><p>Cuadernos de trabajo vivos, nota por nota.</p></a>
  </nav>
  <footer>Osmancito · La materia sigue su curso.</footer>
</main>
</body>
</html>
