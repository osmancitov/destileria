<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Destilería Osmancito</title>
  <meta name="description" content="La Destilería Osmancito: entra al taller de cuadernos vivos o a la bodega de destilados terminados.">
  <link rel="icon" href="destilados/img/icon_amanita.ico">
  <style>
    :root { color-scheme: light; --papel:#faf6ec; --tinta:#2b2417; --oro:#8a6317; --oro-fuerte:#6d4e0f; --muted:#6e6350; --linea:#e2d7bd; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--papel); color:var(--tinta); font: 1rem/1.65 Georgia, 'Times New Roman', serif; }
    main { width:min(680px,calc(100% - 2.5rem)); margin:0 auto; padding:clamp(4rem,12vh,8rem) 0 5rem; }
    .sello { color:var(--oro); font: .72rem/1.5 system-ui,sans-serif; letter-spacing:.28em; text-transform:uppercase; }
    h1 { font-weight:normal; font-size:clamp(2.65rem,8vw,5rem); line-height:1.08; letter-spacing:.035em; margin:2.2rem 0 1rem; }
    h1 span { color:var(--oro); font-style:italic; }
    .lema { color:var(--oro); font-size:clamp(1.1rem,2.5vw,1.45rem); font-style:italic; margin:0 0 4rem; }
    .puertas { border-top:1px solid var(--linea); }
    .puerta { display:block; padding:1.8rem .2rem; color:inherit; text-decoration:none; border-bottom:1px solid var(--linea); transition:padding-left .2s; }
    .puerta:hover,.puerta:focus-visible { padding-left:.9rem; outline:none; }
    .puerta:hover strong,.puerta:focus-visible strong { color:var(--oro); }
    .puerta small { display:block; font: .7rem/1.5 system-ui,sans-serif; letter-spacing:.2em; color:var(--oro); text-transform:uppercase; }
    .puerta strong { display:block; margin:.5rem 0 .3rem; font-size:1.9rem; font-weight:normal; transition:color .2s; }
    .puerta p { color:var(--muted); margin:0; max-width:52ch; }
    footer { margin-top:4rem; border-top:1px solid var(--linea); padding-top:1.2rem; color:var(--muted); font-size:.85rem; }
    @media (max-width:600px) { .puerta strong { font-size:1.6rem; } } }
  </style>
</head>
<body>
<main>
  <h1>Destilería <span>Osmancito</span></h1>
  <nav class="puertas" aria-label="Elige una puerta">
    <a class="puerta" href="bodega.html"><small>Obra terminada</small><strong>La Bodega</strong><p>Los destilados reposan y añejan aquí.</p></a>
    <a class="puerta" href="taller.html"><small>Obra en marcha</small><strong>El Taller</strong><p>Cuadernos de trabajo vivos, nota por nota.</p></a>
  </nav>
</main>
</body>
</html>
